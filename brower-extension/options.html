<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>PhishGuard Settings</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 560px; margin: 40px auto; color: #222; }
  h1 { font-size: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-top: 18px; }
  input, textarea { width: 100%; padding: 8px; margin-top: 6px; box-sizing: border-box; font-family: inherit; }
  textarea { height: 100px; }
  button { margin-top: 16px; padding: 8px 16px; background: #4c8dff; color: white; border: none; border-radius: 6px; cursor: pointer; }
  .hint { font-size: 12px; color: #666; margin-top: 4px; }
  #saved { font-size: 12px; color: green; margin-left: 10px; }
</style>
</head>
<body>
  <h1>PhishGuard Settings</h1>

  <label for="apiKey">Google Safe Browsing API key (optional but recommended)</label>
  <input id="apiKey" type="text" placeholder="AIza..." />
  <div class="hint">Free from Google Cloud Console. Without it, link-reputation checks are skipped and only local heuristics run.</div>

  <label for="brands">Extra brands to protect (JSON, optional)</label>
  <textarea id="brands" placeholder='{"mybank": {"display": "My Bank", "domains": ["mybank.com"]}}'></textarea>
  <div class="hint">Add companies you personally receive email from often, so impersonation of them gets flagged too.</div>

  <button id="save">Save</button>
  <span id="saved"></span>

  <script src="options.js"></script>
</body>
</html>
