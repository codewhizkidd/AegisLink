<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>PhishGuard</title>
<style>
  body { width: 380px; font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
  header { padding: 14px 16px; border-bottom: 1px solid #23262e; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 15px; margin: 0; }
  header a { color: #8ab4f8; font-size: 12px; text-decoration: none; }
  .content { padding: 12px 16px; }
  button#scanBtn { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #4c8dff; color: white; font-size: 14px; font-weight: 600; cursor: pointer; }
  button#scanBtn:disabled { opacity: 0.6; cursor: default; }
  #status { font-size: 12px; color: #9aa0a6; margin-top: 8px; text-align: center; }
  ul#results { list-style: none; margin: 12px 0 0; padding: 0; max-height: 420px; overflow-y: auto; }
  li.email { border: 1px solid #23262e; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .row-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .subject { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 250px; }
  .from { font-size: 11px; color: #9aa0a6; margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.safe { background: #1e3a2a; color: #6fdc8c; }
  .badge.suspicious { background: #3a3320; color: #f2c94c; }
  .badge.risky { background: #3a2020; color: #ff6b6b; }
  .reasons { margin-top: 6px; font-size: 11px; color: #c7c9cc; padding-left: 14px; }
  .reasons li { margin-bottom: 2px; }
  .empty { text-align: center; color: #9aa0a6; font-size: 12px; padding: 30px 0; }
</style>
</head>
<body>
  <header>
    <h1>🛡️ PhishGuard</h1>
    <a href="options.html" target="_blank">Settings</a>
  </header>
  <div class="content">
    <button id="scanBtn">Scan last 15 inbox emails</button>
    <div id="status"></div>
    <ul id="results"></ul>
  </div>
  <script src="popup.js"></script>
</body>
</html>
